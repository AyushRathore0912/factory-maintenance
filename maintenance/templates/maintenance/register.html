{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Maintenance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        :root {
            --bg: #e7ebf0;
            --blue: #006cff;
            --blue-light: #00d4ff;
            --text: #303943;
            --muted: #7d8790;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: var(--bg);

            overflow-x: hidden;
            padding: 30px 15px;
        }

        /* =========================
           BACKGROUND CIRCLES
        ========================= */

        .bg-circle {
            position: fixed;
            border-radius: 50%;

            background: var(--bg);

            box-shadow:
                15px 15px 30px rgba(163, 177, 198, .55),
                -15px -15px 30px rgba(255, 255, 255, .9);

            z-index: -1;

            animation: floating 6s ease-in-out infinite;
        }

        .bg1 {
            width: 190px;
            height: 190px;
            top: 7%;
            left: 7%;
        }

        .bg2 {
            width: 130px;
            height: 130px;
            right: 8%;
            bottom: 8%;
            animation-delay: 1.5s;
        }

        .bg3 {
            width: 55px;
            height: 55px;
            right: 20%;
            top: 22%;
            animation-delay: 3s;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        /* =========================
           MAIN CARD
        ========================= */

        .register-wrapper {
            width: 500px;
            max-width: 100%;
        }

        .register-card {
            width: 100%;

            padding: 40px 38px;

            border-radius: 35px;

            background: var(--bg);

            box-shadow:
                20px 20px 40px rgba(163, 177, 198, .65),
                -20px -20px 40px rgba(255, 255, 255, .95);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 86px;
            height: 86px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            color: var(--blue);

            background: var(--bg);

            box-shadow:
                9px 9px 18px rgba(163, 177, 198, .65),
                -9px -9px 18px rgba(255, 255, 255, .95);

            transition: .4s ease;
        }

        .logo:hover {
            transform: translateY(-5px) rotate(8deg);
        }

        .logo svg {
            width: 38px;
            height: 38px;
        }

        /* =========================
           HEADING
        ========================= */

        h1 {
            text-align: center;

            font-size: 27px;
            font-weight: 700;

            color: var(--text);

            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 30px;
        }

        /* =========================
           DJANGO MESSAGES
        ========================= */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 12px;

            padding: 13px 15px;

            border-radius: 14px;

            font-size: 13px;
        }

        .message.error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
        }

        .message.success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        /* =========================
           NAME ROW
        ========================= */

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {
            position: relative;

            width: 100%;
            height: 60px;

            margin-bottom: 20px;
        }

        /* Animated electric border */

        .electric-border {
            position: absolute;

            inset: -2px;

            border-radius: 19px;

            overflow: hidden;

            pointer-events: none;

            opacity: 0;

            transition: opacity .2s ease;
        }

        .electric-border::before {
            content: "";

            position: absolute;

            width: 170%;
            height: 170%;

            left: -35%;
            top: -35%;

            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                #00eaff 45deg,
                #00aaff 65deg,
                #006cff 80deg,
                transparent 105deg,
                transparent 360deg
            );

            animation: electricRotate 1.1s linear infinite;
        }

        .electric-border::after {
            content: "";

            position: absolute;

            inset: 2px;

            border-radius: 17px;

            background: var(--bg);
        }

        .electric-glow {
            position: absolute;

            inset: -4px;

            border-radius: 21px;

            pointer-events: none;

            opacity: 0;

            filter: blur(7px);

            background: #00aaff;
        }

        .input-group:focus-within .electric-border {
            opacity: 1;
        }

        .input-group:focus-within .electric-glow {
            opacity: .45;

            animation: electricPulse 1.1s linear infinite;
        }

        @keyframes electricRotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes electricPulse {

            0% {
                opacity: .25;
            }

            50% {
                opacity: .55;
            }

            100% {
                opacity: .25;
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-group input {
            position: absolute;

            inset: 2px;

            width: calc(100% - 4px);
            height: 56px;

            border: none;
            outline: none;

            border-radius: 16px;

            background: var(--bg);

            color: var(--text);

            font-size: 15px;

            padding: 0 50px 0 18px;

            z-index: 20;

            box-shadow:
                inset 6px 6px 12px rgba(163, 177, 198, .55),
                inset -6px -6px 12px rgba(255, 255, 255, .95);

            transition: box-shadow .25s ease;
        }

        .input-group input:focus {
            box-shadow:
                inset 3px 3px 7px rgba(163, 177, 198, .55),
                inset -3px -3px 7px rgba(255, 255, 255, .95);
        }

        /* input without a right-side icon (no toggle button) */
        .input-group.no-icon input {
            padding: 0 18px;
        }

        /* =========================
           FLOATING LABEL
        ========================= */

        .input-group label {
            position: absolute;

            left: 18px;
            top: 20px;

            z-index: 30;

            color: #89929c;

            font-size: 16px;

            pointer-events: none;

            transition: all .25s ease;

            background: var(--bg);
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -8px;
            left: 13px;

            padding: 2px 8px;

            border-radius: 7px;

            color: var(--blue);

            font-size: 10px;

            line-height: 14px;

            white-space: nowrap;
        }

        .required {
            color: #dc2626;
        }

        /* =========================
           PASSWORD BUTTON
        ========================= */

        .password-toggle {
            position: absolute;

            right: 14px;
            top: 15px;

            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: #7d8790;

            cursor: pointer;

            z-index: 40;

            border-radius: 8px;

            transition: .2s ease;
        }

        .password-toggle:hover {
            color: var(--blue);

            background: rgba(0, 108, 255, .08);
        }

        .password-toggle svg {
            width: 19px;
            height: 19px;
        }

        /* =========================
           REGISTER BUTTON
        ========================= */

        .main-btn {
            position: relative;

            isolation: isolate;

            width: 100%;
            height: 55px;

            border: none;

            border-radius: 17px;

            background: var(--bg);

            color: var(--blue);

            font-size: 14px;

            font-weight: 700;

            letter-spacing: .4px;

            cursor: pointer;

            overflow: hidden;

            box-shadow:
                8px 8px 16px rgba(163, 177, 198, .65),
                -8px -8px 16px rgba(255, 255, 255, .95);

            transition: .3s ease;

            margin-top: 4px;
        }

        .main-btn::before {
            content: "";

            position: absolute;

            inset: 0;

            background: linear-gradient(
                110deg,
                #006cff,
                #00cfff,
                #006cff
            );

            background-size: 200% 100%;

            transform: translateY(100%);

            transition: transform .35s ease;

            z-index: -1;
        }

        .main-btn:hover::before {
            transform: translateY(0);

            animation: buttonMove 1.5s linear infinite;
        }

        @keyframes buttonMove {

            from {
                background-position: 0 50%;
            }

            to {
                background-position: 200% 50%;
            }
        }

        .main-btn:hover {
            color: #fff;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 114, 255, .35);
        }

        .main-btn:active {
            transform: scale(.97);
        }

        .main-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-area {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid rgba(163, 177, 198, .35);

            text-align: center;

            font-size: 13px;

            color: #7d8790;
        }

        .login-area a {
            color: var(--blue);

            font-weight: 600;

            text-decoration: none;
        }

        .login-area a:hover {
            text-decoration: underline;
        }

        /* =========================
           SECURITY
        ========================= */

        .security {
            margin-top: 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            color: #9aa2aa;

            font-size: 11px;
        }

        .security svg {
            width: 15px;
            height: 15px;
        }

        .copyright {
            text-align: center;

            color: #a0a7ae;

            font-size: 10px;

            margin-top: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 20px 12px;
            }

            .register-card {
                padding: 32px 23px;

                border-radius: 28px;
            }

            h1 {
                font-size: 24px;
            }

            .name-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .bg1 {
                width: 110px;
                height: 110px;
            }

            .bg2 {
                width: 80px;
                height: 80px;
            }

            .bg3 {
                display: none;
            }
        }

    </style>
</head>

<body>

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <main class="register-wrapper">

        <div class="register-card">

            <!-- LOGO -->

            <div class="logo">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.7"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16 21v-2
                           a4 4 0 0 0-4-4H6
                           a4 4 0 0 0-4 4v2"
                    />

                    <circle
                        cx="9"
                        cy="7"
                        r="4"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M19 8v6M22 11h-6"
                    />

                </svg>

            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register for Maintenance Tracker
            </p>


            <!-- DJANGO MESSAGES -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message {% if message.tags == 'error' %}error{% else %}success{% endif %}">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                method="POST"
                action="{% url 'register' %}"
            >

                {% csrf_token %}


                <!-- FIRST + LAST NAME -->

                <div class="name-row">

                    <div class="input-group no-icon">

                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            autocomplete="given-name"
                            placeholder=" "
                        >

                        <label for="first_name">
                            First Name
                        </label>

                    </div>

                    <div class="input-group no-icon">

                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            autocomplete="family-name"
                            placeholder=" "
                        >

                        <label for="last_name">
                            Last Name
                        </label>

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="input-group no-icon">

                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder=" "
                        required
                        autofocus
                    >

                    <label for="username">
                        Username <span class="required">*</span>
                    </label>

                </div>


                <!-- EMAIL -->

                <div class="input-group no-icon">

                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder=" "
                    >

                    <label for="email">
                        Email
                    </label>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder=" "
                        required
                    >

                    <label for="password">
                        Password <span class="required">*</span>
                    </label>

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >

                        <svg
                            id="eyeIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M2.25 12
                                   s3.75-6 9.75-6
                                   9.75 6 9.75 6
                                   -3.75 6-9.75 6
                                   -9.75-6-9.75-6z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />

                        </svg>

                    </button>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <div class="electric-glow"></div>
                    <div class="electric-border"></div>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder=" "
                        required
                    >

                    <label for="confirm_password">
                        Confirm Password <span class="required">*</span>
                    </label>

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >

                        <svg
                            id="eyeIconConfirm"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="1.8"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M2.25 12
                                   s3.75-6 9.75-6
                                   9.75 6 9.75 6
                                   -3.75 6-9.75 6
                                   -9.75-6-9.75-6z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />

                        </svg>

                    </button>

                </div>


                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    id="registerButton"
                    class="main-btn"
                >

                    Create Account

                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-area">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login here
                </a>

            </div>


            <!-- SECURITY -->

            <div class="security">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 3l7 4v5
                           c0 4.5-3 7.5-7 9
                           -4-1.5-7-4.5-7-9V7l7-4z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9.5 12l1.7 1.7
                           3.3-3.4"
                    />

                </svg>

                <span>
                    Secure registration
                </span>

            </div>


            <p class="copyright">
                Maintenance Tracker © 2026
            </p>

        </div>

    </main>


    <script>
        document.addEventListener("DOMContentLoaded", function () {

    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");

    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm_password");

    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
    const eyeIconConfirm = document.getElementById("eyeIconConfirm");


    /*
    ============================================
    EYE ICON MARKUP
    ============================================
    */

    const EYE_OPEN = `
        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 12
               s3.75-6 9.75-6
               9.75 6 9.75 6
               -3.75 6-9.75 6
               -9.75-6-9.75-6z"
        />

        <circle
            cx="12"
            cy="12"
            r="2.5"
        />
    `;

    const EYE_CLOSED = `
        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3l18 18"
        />

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 10.5
               a2.5 2.5 0 0 0
               3 3"
        />

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6.7 6.7
               C4.2 8.2 2.5 10.5 2.5 12
               c0 0 3.5 6 9.5 6
               1.8 0 3.4-.5 4.8-1.2"
        />

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17.3 17.3
               C19.8 15.8 21.5 13.5 21.5 12
               c0 0-3.5-6-9.5-6
               -1.1 0-2.1.2-3 .5"
        />
    `;


    /*
    ============================================
    PASSWORD SHOW / HIDE (generic)
    ============================================
    */

    function setupToggle(input, button, icon) {

        if (!input || !button || !icon) return;

        button.addEventListener("click", function () {

            if (input.type === "password") {

                input.type = "text";
                icon.innerHTML = EYE_CLOSED;
                button.setAttribute("aria-label", "Hide password");

            } else {

                input.type = "password";
                icon.innerHTML = EYE_OPEN;
                button.setAttribute("aria-label", "Show password");

            }

        });

    }

    setupToggle(password, togglePassword, eyeIcon);
    setupToggle(confirmPassword, toggleConfirmPassword, eyeIconConfirm);


    /*
    ============================================
    REMOVE ERROR STATE WHEN USER TYPES
    ============================================
    */

    [username, password, confirmPassword].forEach(function (field) {

        if (field) {

            field.addEventListener("input", function () {

                this.classList.remove("input-error");

            });

        }

    });


    /*
    ============================================
    FORM VALIDATION
    ============================================
    */

    if (registerForm) {

        registerForm.addEventListener("submit", function (event) {

            let valid = true;
            let firstInvalid = null;


            /* USERNAME */

            if (username && username.value.trim() === "") {

                valid = false;
                username.classList.add("input-error");
                firstInvalid = firstInvalid || username;

            }


            /* PASSWORD */

            if (password && password.value === "") {

                valid = false;
                password.classList.add("input-error");
                firstInvalid = firstInvalid || password;

            }


            /* CONFIRM PASSWORD */

            if (confirmPassword && confirmPassword.value === "") {

                valid = false;
                confirmPassword.classList.add("input-error");
                firstInvalid = firstInvalid || confirmPassword;

            }


            /* PASSWORD MATCH */

            if (
                valid &&
                password &&
                confirmPassword &&
                password.value !== confirmPassword.value
            ) {

                valid = false;
                confirmPassword.classList.add("input-error");
                firstInvalid = firstInvalid || confirmPassword;
                alert("Passwords do not match.");

            }


            if (!valid) {

                event.preventDefault();

                if (firstInvalid) firstInvalid.focus();

                return;

            }


            /*
            IMPORTANT:
            Do NOT prevent normal submission
            when validation passes — Django must
            receive the POST request.
            */

            if (registerButton) {

                registerButton.textContent = "Creating Account...";
                registerButton.disabled = true;

            }

        });

    }

});

    </script>

</body>

</html>
