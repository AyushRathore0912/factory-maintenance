{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Maintenance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: #e7ebf0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #303640;
            overflow-x: hidden;
        }

        /* =========================
           BACKGROUND CIRCLES
        ========================= */

        .circle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .circle.one {
            width: 280px;
            height: 280px;
            top: -100px;
            left: -100px;
            background: rgba(37, 99, 235, 0.08);
        }

        .circle.two {
            width: 350px;
            height: 350px;
            bottom: -160px;
            right: -130px;
            background: rgba(37, 99, 235, 0.07);
        }

        .circle.three {
            width: 120px;
            height: 120px;
            top: 15%;
            right: 8%;
            background: rgba(255, 255, 255, 0.35);
        }

        /* =========================
           REGISTER CARD
        ========================= */

        .register-wrapper {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 2;
        }

        .register-card {
            background: #e7ebf0;
            border-radius: 28px;
            padding: 38px 42px;
            box-shadow:
                18px 18px 40px rgba(163, 177, 198, 0.55),
                -18px -18px 40px rgba(255, 255, 255, 0.95);
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            background: #e7ebf0;

            box-shadow:
                8px 8px 16px rgba(163, 177, 198, 0.5),
                -8px -8px 16px rgba(255, 255, 255, 0.9);

            color: #2563eb;
        }

        .header h1 {
            font-size: 27px;
            font-weight: 700;
            color: #252b33;
            margin-bottom: 5px;
        }

        .header p {
            color: #737b86;
            font-size: 13px;
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .message.error {
            color: #b42318;
            background: rgba(254, 226, 226, 0.8);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        .message.success {
            color: #15803d;
            background: rgba(220, 252, 231, 0.8);
            border: 1px solid rgba(74, 222, 128, 0.25);
        }

        /* =========================
           FORM
        ========================= */

        .form {
            width: 100%;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            position: relative;
            margin-bottom: 21px;
        }

        .field input {
            width: 100%;
            height: 56px;

            border: none;
            outline: none;

            border-radius: 15px;

            background: #e7ebf0;

            padding: 18px 17px 4px;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #303640;

            box-shadow:
                inset 6px 6px 12px rgba(163, 177, 198, 0.38),
                inset -6px -6px 12px rgba(255, 255, 255, 0.85);

            transition: 0.25s ease;
        }

        .field input:focus {
            box-shadow:
                inset 5px 5px 10px rgba(163, 177, 198, 0.28),
                inset -5px -5px 10px rgba(255, 255, 255, 0.8),
                0 0 0 2px rgba(37, 99, 235, 0.16),
                0 0 14px rgba(37, 99, 235, 0.22);
        }

        .field label {
            position: absolute;
            left: 17px;
            top: 18px;

            font-size: 13px;
            color: #7a828d;

            pointer-events: none;

            transition: 0.2s ease;
        }

        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: 7px;
            font-size: 10px;
            font-weight: 600;
            color: #2563eb;
        }

        .field input::placeholder {
            color: transparent;
        }

        /* =========================
           PASSWORD FIELD
        ========================= */

        .password-field input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            width: 28px;
            height: 28px;

            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #737b86;

            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .toggle-password svg {
            width: 19px;
            height: 19px;
        }

        /* =========================
           REQUIRED
        ========================= */

        .required {
            color: #dc2626;
            font-size: 11px;
            margin-left: 3px;
        }

        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {
            position: relative;

            width: 100%;
            height: 55px;

            border: none;
            border-radius: 15px;

            margin-top: 5px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6,
                #60a5fa
            );

            background-size: 200% 200%;

            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                8px 8px 18px rgba(37, 99, 235, 0.25),
                -5px -5px 12px rgba(255, 255, 255, 0.75);

            transition: 0.25s ease;

            animation: gradientMove 4s ease infinite;
        }

        .submit-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                10px 10px 22px rgba(37, 99, 235, 0.32),
                -5px -5px 12px rgba(255, 255, 255, 0.8);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* =========================
           LOGIN LINK
        ========================= */

        .login-section {
            text-align: center;

            margin-top: 25px;
            padding-top: 21px;

            border-top: 1px solid rgba(150, 160, 175, 0.22);
        }

        .login-section p {
            font-size: 12px;
            color: #737b86;
        }

        .login-section a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
        }

        .login-section a:hover {
            text-decoration: underline;
        }

        /* =========================
           SECURITY
        ========================= */

        .security {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-top: 19px;

            color: #8a929d;
            font-size: 10px;
        }

        .security svg {
            width: 14px;
            height: 14px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;
            margin-top: 18px;

            font-size: 10px;
            color: #9299a3;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 18px 12px;
            }

            .register-card {
                padding: 30px 22px;
                border-radius: 23px;
            }

            .header h1 {
                font-size: 23px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .logo {
                width: 62px;
                height: 62px;
                font-size: 25px;
            }

            .circle.three {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>


    <div class="register-wrapper">

        <div class="register-card">

            <!-- HEADER -->

            <div class="header">

                <div class="logo">
                    👤
                </div>

                <h1>Create Account</h1>

                <p>
                    Register for Maintenance Tracker
                </p>

            </div>


            <!-- MESSAGES -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message
                            {% if message.tags == 'error' %}
                                error
                            {% else %}
                                success
                            {% endif %}
                        ">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- REGISTER FORM -->

            <form
                id="registerForm"
                class="form"
                method="POST"
                action="{% url 'register' %}"
            >

                {% csrf_token %}


                <!-- FIRST + LAST NAME -->

                <div class="row">

                    <div class="field">

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            autocomplete="given-name"
                            placeholder="First Name"
                        >

                        <label for="first_name">
                            First Name
                        </label>

                    </div>


                    <div class="field">

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            autocomplete="family-name"
                            placeholder="Last Name"
                        >

                        <label for="last_name">
                            Last Name
                        </label>

                    </div>

                </div>


                <!-- USERNAME -->

                <div class="field">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Username"
                    >

                    <label for="username">
                        Username
                        <span class="required">*</span>
                    </label>

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Email"
                    >

                    <label for="email">
                        Email
                    </label>

                </div>


                <!-- PASSWORD -->

                <div class="field password-field">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="new-password"
                        placeholder="Password"
                    >

                    <label for="password">
                        Password
                        <span class="required">*</span>
                    </label>

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >

                        <svg
                            id="passwordEye"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                    </button>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="field password-field">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        required
                        autocomplete="new-password"
                        placeholder="Confirm Password"
                    >

                    <label for="confirm_password">
                        Confirm Password
                        <span class="required">*</span>
                    </label>

                    <button
                        type="button"
                        class="toggle-password"
                        id="toggleConfirmPassword"
                        aria-label="Show password"
                    >

                        <svg
                            id="confirmPasswordEye"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>

                    </button>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="registerButton"
                    class="submit-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-section">

                <p>
                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>
                </p>

            </div>


            <!-- SECURITY -->

            <div class="security">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>

                Secure registration

            </div>

        </div>


        <div class="footer">
            Maintenance Tracker
        </div>

    </div>


    <!-- REGISTER JAVASCRIPT -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const password =
                document.getElementById("password");

            const confirmPassword =
                document.getElementById("confirm_password");

            const togglePassword =
                document.getElementById("togglePassword");

            const toggleConfirmPassword =
                document.getElementById("toggleConfirmPassword");

            const registerForm =
                document.getElementById("registerForm");

            const registerButton =
                document.getElementById("registerButton");


            /* =========================
               PASSWORD TOGGLE
            ========================= */

            function setupPasswordToggle(
                input,
                button
            ) {

                button.addEventListener("click", function () {

                    if (input.type === "password") {

                        input.type = "text";

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                        button.innerHTML = `
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                <path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18.2 18.2 0 0 1-3.1 4.4"></path>
                                <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 4.4-1"></path>
                            </svg>
                        `;

                    } else {

                        input.type = "password";

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                        button.innerHTML = `
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        `;
                    }

                });

            }


            setupPasswordToggle(
                password,
                togglePassword
            );

            setupPasswordToggle(
                confirmPassword,
                toggleConfirmPassword
            );


            /* =========================
               FORM SUBMISSION
            ========================= */

            registerForm.addEventListener(
                "submit",
                function (event) {

                    const username =
                        document.getElementById("username");

                    if (!username.value.trim()) {

                        event.preventDefault();

                        username.focus();

                        return;
                    }


                    if (!password.value) {

                        event.preventDefault();

                        password.focus();

                        return;
                    }


                    if (!confirmPassword.value) {

                        event.preventDefault();

                        confirmPassword.focus();

                        return;
                    }


                    if (
                        password.value !==
                        confirmPassword.value
                    ) {

                        event.preventDefault();

                        alert("Passwords do not match.");

                        confirmPassword.focus();

                        return;
                    }


                    /*
                     * IMPORTANT:
                     * Do NOT prevent valid form submission.
                     * Django needs to receive this POST request.
                     */

                    registerButton.textContent =
                        "Creating Account...";

                    registerButton.disabled = true;

                }
            );

        });

    </script>

</body>

</html>
