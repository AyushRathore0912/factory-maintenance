{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | Maintenance Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb'
                    }
                }
            }
        }
    </script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">


    <!-- REGISTER CONTAINER -->

    <div class="w-full max-w-md">


        <!-- CARD -->

        <div class="bg-white rounded-2xl shadow-lg
                    border border-gray-200
                    p-6 sm:p-8">


            <!-- HEADER -->

            <div class="text-center mb-6">

                <div
                    class="w-14 h-14 mx-auto
                           rounded-2xl
                           bg-blue-100
                           flex items-center
                           justify-center
                           text-2xl">

                    👤

                </div>


                <h1
                    class="text-2xl font-bold
                           text-gray-900 mt-4">

                    Create Account

                </h1>


                <p
                    class="text-sm text-gray-500
                           mt-2">

                    Register for Maintenance Tracker

                </p>

            </div>



            <!-- MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div
                        class="mb-4 p-3 rounded-xl
                               {% if message.tags == 'error' %}
                                   bg-red-50 text-red-700
                               {% else %}
                                   bg-green-50 text-green-700
                               {% endif %}
                               text-sm">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}



            <!-- REGISTER FORM -->

            <form
                method="POST"
                action="{% url 'register' %}"
                class="space-y-4">

                {% csrf_token %}


                <!-- FIRST NAME -->

                <div>

                    <label
                        for="first_name"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        First Name

                    </label>


                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        autocomplete="given-name"
                        placeholder="Enter first name"
                        class="w-full rounded-xl
                               border border-gray-300
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500">

                </div>



                <!-- LAST NAME -->

                <div>

                    <label
                        for="last_name"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        Last Name

                    </label>


                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        autocomplete="family-name"
                        placeholder="Enter last name"
                        class="w-full rounded-xl
                               border border-gray-300
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500">

                </div>



                <!-- USERNAME -->

                <div>

                    <label
                        for="username"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        Username
                        <span class="text-red-500">*</span>

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                        placeholder="Choose a username"
                        class="w-full rounded-xl
                               border border-gray-300
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500">

                </div>



                <!-- EMAIL -->

                <div>

                    <label
                        for="email"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        Email

                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter email address"
                        class="w-full rounded-xl
                               border border-gray-300
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500
                               focus:border-blue-500">

                </div>



                <!-- PASSWORD -->

                <div>

                    <label
                        for="password"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        Password
                        <span class="text-red-500">*</span>

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                            placeholder="Create a password"
                            class="w-full rounded-xl
                                   border border-gray-300
                                   px-4 py-3 pr-12
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500">


                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3
                                   top-1/2
                                   -translate-y-1/2
                                   text-gray-500
                                   hover:text-gray-700">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div>

                    <label
                        for="confirm_password"
                        class="block text-sm
                               font-medium
                               text-gray-700 mb-2">

                        Confirm Password
                        <span class="text-red-500">*</span>

                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                            placeholder="Confirm your password"
                            class="w-full rounded-xl
                                   border border-gray-300
                                   px-4 py-3 pr-12
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-blue-500
                                   focus:border-blue-500">


                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="absolute right-3
                                   top-1/2
                                   -translate-y-1/2
                                   text-gray-500
                                   hover:text-gray-700">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="w-full
                           bg-blue-600
                           hover:bg-blue-700
                           text-white
                           font-semibold
                           rounded-xl
                           px-4 py-3
                           transition
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500
                           focus:ring-offset-2">

                    Create Account

                </button>


            </form>



            <!-- LOGIN LINK -->

            <div
                class="text-center
                       mt-6 pt-5
                       border-t border-gray-200">

                <p class="text-sm text-gray-500">

                    Already have an account?

                    <a
                        href="{% url 'login' %}"
                        class="text-blue-600
                               font-semibold
                               hover:text-blue-700">

                        Login

                    </a>

                </p>

            </div>


        </div>


        <!-- FOOTER -->

        <p
            class="text-center
                   text-xs text-gray-400
                   mt-4">

            Maintenance Tracker

        </p>


    </div>



    <!-- PASSWORD TOGGLE -->

    <script>

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm_password");


        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");


        togglePassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    this.textContent = "🙈";

                } else {

                    password.type = "password";

                    this.textContent = "👁️";

                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (confirmPassword.type === "password") {

                    confirmPassword.type = "text";

                    this.textContent = "🙈";

                } else {

                    confirmPassword.type = "password";

                    this.textContent = "👁️";

                }

            }
        );

    </script>


</body>

</html>
